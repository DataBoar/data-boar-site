name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys — never cancel mid-inject (#22: cancelled run could publish
# committed placeholders / a half-written form-config.js).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # #87: workflow_dispatch has no branch picker filter, so a collaborator with
    # contents:write could dispatch this from a forged non-main branch (e.g. a
    # gh-pages branch never protected by main's signature/PR rules) and publish
    # it unreviewed. Refuse to run unless the triggering ref really is main —
    # belt-and-suspenders with the checkout pin below, since either alone still
    # depends on the other not having a bug.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      # HubSpot portal/form IDs are PUBLIC (also committed in js/form-config.js).
      # Still inject from secrets when present so ops can rotate without a content PR.
      # Use json.dumps (not an unquoted heredoc) so values cannot break out of JS
      # string literals (#68). If a secret is empty, keep the committed file.
      - name: Inject HubSpot form config (safe JSON → JS)
        env:
          HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_PORTAL_ID }}
          HUBSPOT_DEMO_FORM_GUID: ${{ secrets.HUBSPOT_DEMO_FORM_GUID }}
          HUBSPOT_REGION: ${{ secrets.HUBSPOT_REGION }}
          HUBSPOT_MARKETING_SUBSCRIPTION_TYPE_ID: ${{ secrets.HUBSPOT_MARKETING_SUBSCRIPTION_TYPE_ID }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, sys

          portal = os.environ.get("HUBSPOT_PORTAL_ID", "").strip()
          guid = os.environ.get("HUBSPOT_DEMO_FORM_GUID", "").strip()
          region = os.environ.get("HUBSPOT_REGION", "").strip() or "na1"
          sub = os.environ.get("HUBSPOT_MARKETING_SUBSCRIPTION_TYPE_ID", "").strip()
          out = pathlib.Path("js/form-config.js")

          if not portal or not guid:
              if not out.is_file():
                  print("ERROR: secrets empty and js/form-config.js missing", file=sys.stderr)
                  sys.exit(1)
              print("secrets incomplete — keeping committed js/form-config.js")
              sys.exit(0)

          cfg_values = {
              "portalId": portal,
              "demoFormGuid": guid,
              "region": region,
              "marketingSubscriptionTypeId": sub,
              "fallbackMailto": "contact@databoar.com.br",
          }
          # json.dumps on values only — keys stay JS identifiers (matches committed style
          # and the verify regex). Never interpolate secrets into an unquoted heredoc.
          v = {k: json.dumps(val, ensure_ascii=True) for k, val in cfg_values.items()}
          body = (
              "window.DATA_BOAR_FORM_CONFIG = {\n"
              "  hubspot: {\n"
              f"    portalId: {v['portalId']},\n"
              f"    demoFormGuid: {v['demoFormGuid']},\n"
              f"    region: {v['region']},\n"
              f"    marketingSubscriptionTypeId: {v['marketingSubscriptionTypeId']},\n"
              "  },\n"
              f"  fallbackMailto: {v['fallbackMailto']},\n"
              "};\n"
          )
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(body, encoding="utf-8")
          print(f"wrote {out} (portalId length={len(portal)})")
          PY

      - name: Verify form-config has a non-empty portalId
        run: |
          python3 <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("js/form-config.js").read_text(encoding="utf-8")
          # Accept committed style (portalId: '…') and inject style (portalId: "…").
          m = re.search(r"""portalId\s*:\s*(['"])([^'"]+)\1""", text)
          if not m or not m.group(2).strip():
              print("ERROR: portalId empty in js/form-config.js — refusing deploy", file=sys.stderr)
              sys.exit(1)
          print(f"ok portalId={m.group(2)[:4]}…")
          PY

      # v3.0.1 (56afc609) is SHA-pinned *here* but its composite still called
      # actions/upload-artifact@v4 (floating tag). Org sha_pinning_required
      # inspects transitive uses and blocked every Pages deploy since 2026-08-24.
      # v5.0.0 pins upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f (v7.0.0).
      # include-hidden-files: .well-known/security.txt (RFC 9116); .git/.github stay excluded.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
