name: Site live parity

# "Merge green" != "site no ar". Este check prova que o conteúdo publicado no
# GitHub Pages bate com o main. Roda no push em main (logo após o merge), de hora
# em hora como monitor contínuo e sob demanda.
# Para valer no merge-green, adicionar "Site live parity" aos required checks
# da branch ruleset de main (decisão do operador — não mexemos na regra daqui).
#
# NAO usar workflow_run: zizmor classifica como dangerous-triggers (high).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-live-parity
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (fonte da verdade publicada)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Provar que o ar == main
        # O Pages publica de forma assíncrona; o retry espera até ~2 min.
        run: bash scripts/site-live-check.sh
